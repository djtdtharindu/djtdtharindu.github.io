<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #06060f;
    --panel: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.07);
    --accent: #6366f1;
    --accent2: #ec4899;
    --grad: linear-gradient(135deg,#6366f1,#ec4899);
    --text: #f0f2f5;
    --muted: #8d95a0;
    --success: #22c55e;
    --error: #ef4444;
    --warn: #f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.3;pointer-events:none;z-index:0}
.o1{width:400px;height:400px;background:#6366f1;top:-100px;left:-100px}
.o2{width:300px;height:300px;background:#ec4899;bottom:-50px;right:-50px}

/* Header */
header{
    background:rgba(6,6,15,0.8);backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    padding:1rem 2rem;display:flex;align-items:center;gap:1rem;
    position:sticky;top:0;z-index:100;
}
.logo-icon{width:38px;height:38px;background:var(--grad);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
header h1{font-family:'Space Grotesk',sans-serif;font-size:1.2rem}
header p{color:var(--muted);font-size:.85rem;margin-left:auto}

/* Stats bar */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;padding:1.5rem 2rem;position:relative;z-index:1}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.5rem;backdrop-filter:blur(10px)}
.stat-card .label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:.4rem}
.stat-card .value{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700}
.stat-card .value.green{color:var(--success)}
.stat-card .value.accent{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Layout */
.main{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;padding:0 2rem 2rem;position:relative;z-index:1}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(10px);overflow:hidden}
.panel-header{padding:1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.6rem;font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:600}
.panel-header .ph-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.ph-blue{background:rgba(99,102,241,.2);color:#a5b4fc}
.ph-pink{background:rgba(236,72,153,.2);color:#f9a8d4}
.ph-green{background:rgba(34,197,94,.2);color:#86efac}
.panel-body{padding:1.5rem}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.form-group{display:flex;flex-direction:column;gap:.4rem}
.form-group label{font-size:.82rem;color:var(--muted);font-weight:500}
.form-group input, .form-group select{
    background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    border-radius:8px;padding:.6rem .9rem;
    color:var(--text);font-family:'Outfit',sans-serif;font-size:.9rem;
    transition:.2s;outline:none;
}
.form-group input:focus, .form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.form-group.full{grid-column:1/-1}
.btn{
    padding:.65rem 1.4rem;border:none;border-radius:8px;
    font-family:'Outfit',sans-serif;font-size:.9rem;font-weight:600;
    cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:.4rem;
}
.btn-primary{background:var(--grad);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.35)}
.btn-danger{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:.35rem .8rem;font-size:.8rem}
.btn-success{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.2)}
.btn-success:hover{background:rgba(34,197,94,.2)}
.actions-row{display:flex;gap:.6rem;margin-top:1rem;justify-content:flex-end}

/* Table */
.table-wrap{overflow-x:auto;max-height:280px;overflow-y:auto}
.table-wrap::-webkit-scrollbar{width:4px;height:4px}
.table-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:.87rem}
th{padding:.7rem 1rem;text-align:left;color:var(--muted);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#0d0d1a}
td{padding:.7rem 1rem;border-bottom:1px solid rgba(255,255,255,.03)}
tr:last-child td{border:none}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:4px;font-size:.75rem;font-weight:600}
.badge-ok{background:rgba(34,197,94,.12);color:#22c55e}
.badge-low{background:rgba(245,158,11,.12);color:#f59e0b}
.badge-out{background:rgba(239,68,68,.12);color:#ef4444}

/* Sales panel full width */
.full-width{grid-column:1/-1}

/* Toast */
.toast-wrap{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;display:flex;flex-direction:column;gap:.5rem}
.toast{
    background:rgba(20,20,30,.95);border:1px solid var(--border);
    border-radius:10px;padding:.7rem 1.2rem;
    font-size:.88rem;backdrop-filter:blur(10px);
    animation:slideIn .3s ease;display:flex;align-items:center;gap:.5rem;
}
.toast.success{border-color:rgba(34,197,94,.3);color:#22c55e}
.toast.error{border-color:rgba(239,68,68,.3);color:#ef4444}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

@media(max-width:900px){
    .main{grid-template-columns:1fr}
    .stats-bar{grid-template-columns:1fr 1fr}
    .full-width{grid-column:1}
}
</style>
</head>
<body>
<div class="orb o1"></div>
<div class="orb o2"></div>

<header>
    <div class="logo-icon">🛒</div>
    <div>
        <h1>Sales Management System</h1>
        <p>Inventory · Loading · Unloading · Revenue</p>
    </div>
</header>

<div class="stats-bar">
    <div class="stat-card">
        <div class="label">Total Products</div>
        <div class="value accent" id="stat-products">0</div>
    </div>
    <div class="stat-card">
        <div class="label">Total Stock Units</div>
        <div class="value" id="stat-units">0</div>
    </div>
    <div class="stat-card">
        <div class="label">Sales Today</div>
        <div class="value green" id="stat-sales">0</div>
    </div>
    <div class="stat-card">
        <div class="label">Total Revenue</div>
        <div class="value green" id="stat-revenue">LKR 0</div>
    </div>
</div>

<div class="main">
    <!-- Load Stock Panel -->
    <div class="panel">
        <div class="panel-header">
            <div class="ph-icon ph-blue">📦</div>
            Load Stock (Add / Update)
        </div>
        <div class="panel-body">
            <div class="form-grid">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="load-name" placeholder="e.g. Laptop">
                </div>
                <div class="form-group">
                    <label>Price per Unit (LKR)</label>
                    <input type="number" id="load-price" placeholder="0.00" min="0">
                </div>
                <div class="form-group">
                    <label>Quantity to Load</label>
                    <input type="number" id="load-qty" placeholder="0" min="1">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="load-cat">
                        <option>Electronics</option>
                        <option>Clothing</option>
                        <option>Food</option>
                        <option>Books</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>
            <div class="actions-row">
                <button class="btn btn-primary" onclick="loadStock()">📦 Load Stock</button>
            </div>
        </div>
    </div>

    <!-- Record Sale Panel -->
    <div class="panel">
        <div class="panel-header">
            <div class="ph-icon ph-pink">💸</div>
            Record Sale (Unload Stock)
        </div>
        <div class="panel-body">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Select Product</label>
                    <select id="sale-product"><option value="">-- Select a product --</option></select>
                </div>
                <div class="form-group">
                    <label>Quantity to Sell</label>
                    <input type="number" id="sale-qty" placeholder="0" min="1">
                </div>
                <div class="form-group">
                    <label>Available Stock</label>
                    <input type="text" id="sale-stock" readonly placeholder="Select product first" style="color:var(--muted)">
                </div>
                <div class="form-group">
                    <label>Unit Price (LKR)</label>
                    <input type="text" id="sale-price-display" readonly placeholder="—" style="color:var(--muted)">
                </div>
                <div class="form-group">
                    <label>Total Amount (LKR)</label>
                    <input type="text" id="sale-total" readonly placeholder="—" style="color:var(--success);font-weight:700">
                </div>
            </div>
            <div class="actions-row">
                <button class="btn btn-success" onclick="recordSale()">✅ Record Sale</button>
            </div>
        </div>
    </div>

    <!-- Inventory Table -->
    <div class="panel">
        <div class="panel-header">
            <div class="ph-icon ph-blue">📊</div>
            Current Inventory
        </div>
        <div class="panel-body" style="padding:0">
            <div class="table-wrap">
                <table>
                    <thead><tr>
                        <th>Product</th><th>Category</th><th>Qty</th><th>Price</th><th>Status</th><th></th>
                    </tr></thead>
                    <tbody id="inventory-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Sales History -->
    <div class="panel">
        <div class="panel-header">
            <div class="ph-icon ph-green">📋</div>
            Sales History
        </div>
        <div class="panel-body" style="padding:0">
            <div class="table-wrap">
                <table>
                    <thead><tr>
                        <th>Time</th><th>Product</th><th>Qty</th><th>Total</th>
                    </tr></thead>
                    <tbody id="sales-table"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
let inventory = JSON.parse(localStorage.getItem('sms_inventory') || '[]');
let sales     = JSON.parse(localStorage.getItem('sms_sales') || '[]');

function save() {
    localStorage.setItem('sms_inventory', JSON.stringify(inventory));
    localStorage.setItem('sms_sales', JSON.stringify(sales));
}

function toast(msg, type='success') {
    const wrap = document.getElementById('toast-wrap');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function loadStock() {
    const name  = document.getElementById('load-name').value.trim();
    const price = parseFloat(document.getElementById('load-price').value);
    const qty   = parseInt(document.getElementById('load-qty').value);
    const cat   = document.getElementById('load-cat').value;
    if (!name || isNaN(price) || isNaN(qty) || qty < 1) return toast('Please fill all fields correctly.', 'error');

    const existing = inventory.find(i => i.name.toLowerCase() === name.toLowerCase());
    if (existing) {
        existing.quantity += qty;
        existing.price = price;
        toast(`✅ Stock updated: +${qty} units of ${name}`);
    } else {
        inventory.push({ id: Date.now(), name, price, quantity: qty, category: cat });
        toast(`✅ New product added: ${name}`);
    }
    save(); render();
    document.getElementById('load-name').value = '';
    document.getElementById('load-price').value = '';
    document.getElementById('load-qty').value = '';
}

function recordSale() {
    const prodId = parseInt(document.getElementById('sale-product').value);
    const qty    = parseInt(document.getElementById('sale-qty').value);
    const item   = inventory.find(i => i.id === prodId);
    if (!item) return toast('Select a valid product.', 'error');
    if (isNaN(qty) || qty < 1) return toast('Enter a valid quantity.', 'error');
    if (qty > item.quantity) return toast(`Insufficient stock! Available: ${item.quantity}`, 'error');

    item.quantity -= qty;
    const total = qty * item.price;
    sales.unshift({ time: new Date().toLocaleTimeString(), product: item.name, qty, total });
    save(); render();
    toast(`💸 Sale recorded! LKR ${total.toLocaleString()}`);
    document.getElementById('sale-qty').value = '';
    document.getElementById('sale-stock').value = '';
    document.getElementById('sale-total').value = '';
    document.getElementById('sale-price-display').value = '';
    document.getElementById('sale-product').value = '';
}

function deleteItem(id) {
    inventory = inventory.filter(i => i.id !== id);
    save(); render();
    toast('Product removed.', 'error');
}

function updateSaleInfo() {
    const prodId = parseInt(document.getElementById('sale-product').value);
    const item = inventory.find(i => i.id === prodId);
    const qty = parseInt(document.getElementById('sale-qty').value) || 0;
    if (item) {
        document.getElementById('sale-stock').value = item.quantity;
        document.getElementById('sale-price-display').value = `LKR ${item.price.toLocaleString()}`;
        document.getElementById('sale-total').value = qty > 0 ? `LKR ${(qty * item.price).toLocaleString()}` : '—';
    }
}

function render() {
    // Stats
    const totalUnits = inventory.reduce((s,i) => s+i.quantity, 0);
    const revenue    = sales.reduce((s,i) => s+i.total, 0);
    document.getElementById('stat-products').textContent = inventory.length;
    document.getElementById('stat-units').textContent = totalUnits;
    document.getElementById('stat-sales').textContent = sales.length;
    document.getElementById('stat-revenue').textContent = `LKR ${revenue.toLocaleString()}`;

    // Inventory table
    const invTbl = document.getElementById('inventory-table');
    invTbl.innerHTML = inventory.length === 0
        ? `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:2rem">No products loaded yet.</td></tr>`
        : inventory.map(i => {
            const status = i.quantity === 0 ? '<span class="badge badge-out">Out</span>'
                         : i.quantity < 5  ? '<span class="badge badge-low">Low</span>'
                         : '<span class="badge badge-ok">OK</span>';
            return `<tr>
                <td>${i.name}</td>
                <td style="color:var(--muted)">${i.category}</td>
                <td><b>${i.quantity}</b></td>
                <td>LKR ${i.price.toLocaleString()}</td>
                <td>${status}</td>
                <td><button class="btn btn-danger btn-sm" onclick="deleteItem(${i.id})">✕</button></td>
            </tr>`;
        }).join('');

    // Sale product dropdown
    const sel = document.getElementById('sale-product');
    const prev = sel.value;
    sel.innerHTML = '<option value="">-- Select a product --</option>'
        + inventory.filter(i=>i.quantity>0).map(i=>`<option value="${i.id}">${i.name} (${i.quantity} left)</option>`).join('');
    sel.value = prev;

    // Sales table
    const saleTbl = document.getElementById('sales-table');
    saleTbl.innerHTML = sales.length === 0
        ? `<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:2rem">No sales recorded yet.</td></tr>`
        : sales.slice(0,50).map(s => `<tr>
            <td style="color:var(--muted);font-size:.82rem">${s.time}</td>
            <td>${s.product}</td>
            <td>${s.qty}</td>
            <td style="color:var(--success);font-weight:600">LKR ${s.total.toLocaleString()}</td>
        </tr>`).join('');
}

document.getElementById('sale-product').addEventListener('change', updateSaleInfo);
document.getElementById('sale-qty').addEventListener('input', updateSaleInfo);

// Seed demo data if empty
if (inventory.length === 0) {
    inventory = [
        { id: 1, name: 'Laptop', price: 150000, quantity: 10, category: 'Electronics' },
        { id: 2, name: 'Wireless Mouse', price: 2500, quantity: 50, category: 'Electronics' },
        { id: 3, name: 'Office Chair', price: 18000, quantity: 8, category: 'Other' },
    ];
    save();
}
render();
</script>
</body>
</html>
