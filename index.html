<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tharindu Dilshan | Portfolio</title>
    <meta name="description" content="Portfolio of Tharindu Dilshan, Full Stack Developer and QA Engineer.">
    <meta name="keywords" content="Tharindu Dilshan, Portfolio, Full Stack Developer, QA Engineer, Java, Python, SQL, C, C++, JavaScript">
    <meta name="author" content="Tharindu Dilshan">
    <meta property="og:title" content="Tharindu Dilshan | Portfolio">
    <meta property="og:description" content="Portfolio of Tharindu Dilshan, Full Stack Developer and QA Engineer.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#050505">
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-animated">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Navigation (shell — filled by JS) -->
    <nav class="glass-nav">
        <div class="nav-container">
            <div class="logo" id="nav-logo"></div>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="mobile-menu-btn" id="mobile-menu-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </div>
        </div>
    </nav>

    <main>
        <!-- Hero Section (shell) -->
        <section id="home" class="hero">
            <div class="hero-container">
                <div class="hero-content">
                    <p class="greeting">Hello, I'm</p>
                    <h1 class="glitch-text" id="hero-name"></h1>
                    <h2 class="role-text">
                        <span class="typing-container">
                            <span id="typewriter"></span><span class="cursor">|</span>
                        </span>
                    </h2>
                    <p class="hero-desc" id="hero-tagline"></p>
                    <div class="hero-cta" id="hero-cta"></div>
                </div>
                <div class="hero-image-wrap">
                    <div class="profile-image-card">
                        <img id="profile-img" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=1000&auto=format&fit=crop" alt="Profile">
                        <div class="image-glow"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- About & Skills Section (shell) -->
        <section id="about" class="about-section fade-in">
            <div class="section-header">
                <h2>About <span class="accent">Me</span></h2>
                <div class="line"></div>
            </div>
            <div class="about-grid">
                <div class="glass-card education-card" id="education-list"></div>
                <div class="skills-container" id="skills-container"></div>
            </div>
        </section>

        <!-- Experience Section (shell) -->
        <section id="experience" class="experience-section fade-in">
            <div class="section-header">
                <h2>My <span class="accent">Experience</span></h2>
                <div class="line"></div>
            </div>
            <div class="timeline" id="timeline"></div>
        </section>

        <!-- Projects Section (shell) -->
        <section id="projects" class="projects-section fade-in">
            <div class="section-header">
                <h2>Featured <span class="accent">Projects</span></h2>
                <div class="line"></div>
            </div>
            <div class="project-filters" id="project-filters"></div>
            <div class="projects-grid" id="projects-grid"></div>
        </section>

        <!-- Extracurriculars Section (shell) -->
        <section id="activities" class="activities-section fade-in">
            <div class="section-header">
                <h2>Extra<span class="accent">curriculars</span></h2>
                <div class="line"></div>
            </div>
            <div class="activities-grid" id="activities-grid"></div>
        </section>

        <!-- Contact Section (shell) -->
        <section id="contact" class="contact-section fade-in">
            <div class="section-header">
                <h2>Let's <span class="accent">Connect</span></h2>
                <div class="line"></div>
            </div>
            <div class="contact-container">
                <!-- Contact Form -->
                <div class="glass-card contact-form-card">
                    <form id="contact-form">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="c-name" placeholder="Enter your name" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="c-email" placeholder="Enter your email" required>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea id="c-message" rows="5" placeholder="How can I help you?" required></textarea>
                        </div>
                        <div class="contact-actions">
                            <button type="submit" class="btn btn-primary" id="btn-email">
                                <span>Send via Email</span>
                            </button>
                            <button type="button" class="btn btn-glass" id="btn-whatsapp">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #25D366;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                                <span>Send via WhatsApp</span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Contact Details -->
                <div class="contact-details-wrap" id="contact-links"></div>
            </div>
        </section>
    </main>

    <footer>
        <p id="footer-text"></p>
    </footer>

    <!-- Terminal / Browser Demo Modal -->
    <div class="modal" id="demo-modal">
        <div class="terminal-container glass-card">
            <div class="terminal-header">
                <div class="dots">
                    <div class="dot red" id="modal-close-dot"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <div class="terminal-title" id="demo-modal-title">Terminal</div>
                <button class="close-btn" id="modal-close-btn">&times;</button>
            </div>
            <div class="terminal-body" id="terminal-body"></div>
        </div>
    </div>

    <!-- Admin Dashboard Modal (Management Tool) -->
    <div class="modal" id="admin-modal">
        <div class="admin-container glass-card">
            <div class="admin-header">
                <h2>Admin Dashboard <span class="badge">Editor</span></h2>
                <button class="close-btn" id="admin-close-btn">&times;</button>
            </div>
            <div class="admin-body">
                <div class="admin-tabs">
                    <button class="tab-btn active" data-tab="personal-tab">Personal Data</button>
                    <button class="tab-btn" data-tab="projects-tab">Projects Manager</button>
                    <button class="tab-btn" data-tab="export-tab">Export data.js</button>
                </div>
                <div class="tab-content active" id="personal-tab">
                    <div class="admin-form" id="admin-personal-form"></div>
                </div>
                <div class="tab-content" id="projects-tab">
                    <div class="admin-project-list" id="admin-project-list"></div>
                    <button class="btn btn-primary mt-4" id="btn-add-project">+ Add New Project</button>
                </div>
                <div class="tab-content" id="export-tab">
                    <p class="mb-2">Click below to download the updated file, then drag it into your VS Code to replace the old one!</p>
                    <div class="code-export-wrap">
                        <pre id="code-export-pre"></pre>
                        <div style="position: absolute; top: 1rem; right: 1rem; display: flex; gap: 0.5rem;">
                            <button class="btn btn-glass btn-sm" id="btn-copy-code">Copy Code</button>
                            <button class="btn btn-primary btn-sm" id="btn-download-data">Download data.js</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="admin-trigger" id="admin-trigger" title="Admin Mode">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>

    <!-- Data config (edit this file to update portfolio) -->
    <script src="data.js"></script>
    <!-- Rendering engine -->
    <script src="script.js"></script>
</body>
</html>
