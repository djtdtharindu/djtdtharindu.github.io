<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#06060f;--panel:rgba(255,255,255,.03);--border:rgba(255,255,255,.07);
    --accent:#6366f1;--accent2:#ec4899;--grad:linear-gradient(135deg,#6366f1,#ec4899);
    --text:#f0f2f5;--muted:#8d95a0;--success:#22c55e;--error:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.3;pointer-events:none;z-index:0}
.o1{width:450px;height:450px;background:#6366f1;top:-100px;left:-100px}
.o2{width:300px;height:300px;background:#8b5cf6;bottom:-50px;right:-50px}

header{
    background:rgba(6,6,15,.85);backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);padding:1rem 2rem;
    display:flex;align-items:center;gap:1rem;
    position:sticky;top:0;z-index:100;
}
.logo-icon{width:38px;height:38px;background:var(--grad);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
header h1{font-family:'Space Grotesk',sans-serif;font-size:1.2rem}

.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;padding:1.5rem 2rem;position:relative;z-index:1}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.4rem;backdrop-filter:blur(10px)}
.stat-card .label{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:.3rem}
.stat-card .value{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700}
.value.g{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.value.green{color:var(--success)}
.value.warn{color:#f59e0b}

.toolbar{padding:0 2rem 1.2rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.search-box{
    flex:1;min-width:200px;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:.6rem 1rem;color:var(--text);font-family:'Outfit',sans-serif;font-size:.9rem;outline:none;
    transition:.2s;
}
.search-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.filter-btns{display:flex;gap:.5rem}
.fb{
    background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:50px;
    padding:.4rem 1rem;color:var(--muted);font-size:.85rem;cursor:pointer;
    font-family:'Outfit',sans-serif;transition:.2s;
}
.fb.active{background:var(--grad);border-color:transparent;color:#fff}
.btn{
    padding:.6rem 1.2rem;border:none;border-radius:8px;
    font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:600;
    cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:.4rem;
}
.btn-primary{background:var(--grad);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.35)}

/* Books grid */
.books-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:1.2rem;padding:0 2rem 2rem;position:relative;z-index:1;
}
.book-card{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:1.4rem;backdrop-filter:blur(10px);
    transition:.25s;position:relative;overflow:hidden;
}
.book-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--grad);opacity:0;transition:.25s;
}
.book-card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.12)}
.book-card:hover::before{opacity:1}
.book-card.borrowed{border-color:rgba(245,158,11,.2);opacity:.8}

.book-cover{
    width:100%;height:120px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:2.5rem;margin-bottom:1rem;
    background:rgba(99,102,241,.08);
}
.book-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:600;margin-bottom:.3rem;line-height:1.3}
.book-author{color:var(--muted);font-size:.85rem;margin-bottom:.6rem}
.book-genre{
    display:inline-block;padding:.2rem .65rem;border-radius:4px;
    font-size:.75rem;font-weight:600;margin-bottom:.8rem;
    background:rgba(99,102,241,.12);color:#a5b4fc;
}
.book-meta{font-size:.8rem;color:var(--muted);margin-bottom:1rem;line-height:1.6}
.book-footer{display:flex;justify-content:space-between;align-items:center}
.status-badge{
    padding:.25rem .7rem;border-radius:6px;font-size:.78rem;font-weight:600;
}
.sb-avail{background:rgba(34,197,94,.12);color:#22c55e}
.sb-borrowed{background:rgba(245,158,11,.12);color:#f59e0b}
.borrow-btn{
    background:var(--grad);color:#fff;border:none;padding:.35rem .9rem;
    border-radius:7px;font-size:.8rem;font-weight:600;cursor:pointer;
    font-family:'Outfit',sans-serif;transition:.2s;
}
.borrow-btn:hover{transform:scale(1.05)}
.borrow-btn.return{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}

/* Add book modal */
.modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);z-index:500;justify-content:center;align-items:center;
}
.modal-overlay.open{display:flex}
.modal{
    background:rgba(15,15,25,.95);border:1px solid var(--border);
    border-radius:18px;padding:2rem;width:100%;max-width:440px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h2{font-family:'Space Grotesk',sans-serif;font-size:1.15rem;margin-bottom:1.4rem}
.form-group{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.9rem}
.form-group label{font-size:.82rem;color:var(--muted)}
.form-group input,.form-group select{
    background:rgba(255,255,255,.05);border:1px solid var(--border);
    border-radius:8px;padding:.6rem .9rem;color:var(--text);
    font-family:'Outfit',sans-serif;font-size:.9rem;outline:none;transition:.2s;
}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:.8rem;justify-content:flex-end;margin-top:1.2rem}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}

/* Toast */
.toast-wrap{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;display:flex;flex-direction:column;gap:.5rem}
.toast{
    background:rgba(15,15,25,.95);border:1px solid var(--border);
    border-radius:10px;padding:.65rem 1.1rem;font-size:.87rem;
    animation:tIn .3s ease;display:flex;align-items:center;gap:.5rem;
}
.toast.s{border-color:rgba(34,197,94,.3);color:#22c55e}
.toast.e{border-color:rgba(239,68,68,.3);color:#ef4444}
@keyframes tIn{from{transform:translateX(110%)}to{transform:translateX(0)}}
</style>
</head>
<body>
<div class="orb o1"></div>
<div class="orb o2"></div>

<header>
    <div class="logo-icon">📚</div>
    <div>
        <h1>Library Management System</h1>
        <p id="header-sub">Digital Library</p>
    </div>
    <button class="btn btn-primary" style="margin-left:auto" onclick="openAddModal()">+ Add Book</button>
</header>

<div class="stats-bar">
    <div class="stat-card"><div class="label">Total Books</div><div class="value g" id="s-total">0</div></div>
    <div class="stat-card"><div class="label">Available</div><div class="value green" id="s-avail">0</div></div>
    <div class="stat-card"><div class="label">Borrowed</div><div class="value warn" id="s-borrowed">0</div></div>
    <div class="stat-card"><div class="label">Genres</div><div class="value g" id="s-genres">0</div></div>
</div>

<div class="toolbar">
    <input class="search-box" id="search" placeholder="🔍  Search by title or author..." oninput="render()">
    <div class="filter-btns" id="filter-btns">
        <button class="fb active" data-filter="all" onclick="setFilter('all')">All</button>
        <button class="fb" data-filter="available" onclick="setFilter('available')">Available</button>
        <button class="fb" data-filter="borrowed" onclick="setFilter('borrowed')">Borrowed</button>
    </div>
</div>

<div class="books-grid" id="books-grid"></div>

<!-- Add Book Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2>📖 Add New Book</h2>
        <div class="form-group"><label>Book Title</label><input id="m-title" placeholder="e.g. Clean Code"></div>
        <div class="form-group"><label>Author</label><input id="m-author" placeholder="e.g. Robert C. Martin"></div>
        <div class="form-group"><label>Genre</label>
            <select id="m-genre">
                <option>Programming</option><option>Science</option><option>Fiction</option>
                <option>Philosophy</option><option>History</option><option>Self-Help</option>
            </select>
        </div>
        <div class="form-group"><label>Year</label><input id="m-year" type="number" placeholder="2024"></div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="addBook()">Add Book</button>
        </div>
    </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
const EMOJIS = {'Programming':'💻','Science':'🔬','Fiction':'📖','Philosophy':'🧠','History':'🏛️','Self-Help':'✨','Other':'📚'};
let books = JSON.parse(localStorage.getItem('lms_books') || 'null');
let filter = 'all';

if (!books) {
    books = [
        {id:1,title:'Clean Code',author:'Robert C. Martin',genre:'Programming',year:2008,borrowed:false,by:'',due:''},
        {id:2,title:'The Pragmatic Programmer',author:'Andrew Hunt',genre:'Programming',year:1999,borrowed:false,by:'',due:''},
        {id:3,title:'A Brief History of Time',author:'Stephen Hawking',genre:'Science',year:1988,borrowed:true,by:'Member #042',due:'2026-05-20'},
        {id:4,title:'1984',author:'George Orwell',genre:'Fiction',year:1949,borrowed:false,by:'',due:''},
        {id:5,title:'Thinking, Fast and Slow',author:'Daniel Kahneman',genre:'Philosophy',year:2011,borrowed:true,by:'Member #017',due:'2026-05-18'},
        {id:6,title:'Sapiens',author:'Yuval Noah Harari',genre:'History',year:2011,borrowed:false,by:'',due:''},
        {id:7,title:'Atomic Habits',author:'James Clear',genre:'Self-Help',year:2018,borrowed:false,by:'',due:''},
        {id:8,title:'Design Patterns',author:'Gang of Four',genre:'Programming',year:1994,borrowed:false,by:'',due:''},
    ];
    save();
}

function save(){localStorage.setItem('lms_books',JSON.stringify(books))}
function toast(msg,type='s'){
    const w=document.getElementById('toast-wrap');
    const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;
    w.appendChild(t);setTimeout(()=>t.remove(),3000);
}
function setFilter(f){
    filter=f;
    document.querySelectorAll('.fb').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));
    render();
}
function openAddModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}

function addBook(){
    const title=document.getElementById('m-title').value.trim();
    const author=document.getElementById('m-author').value.trim();
    const genre=document.getElementById('m-genre').value;
    const year=parseInt(document.getElementById('m-year').value)||new Date().getFullYear();
    if(!title||!author)return toast('Fill in title and author.','e');
    books.push({id:Date.now(),title,author,genre,year,borrowed:false,by:'',due:''});
    save();render();closeModal();
    document.getElementById('m-title').value='';
    document.getElementById('m-author').value='';
    toast(`📖 "${title}" added to library!`);
}

function toggleBorrow(id){
    const book=books.find(b=>b.id===id);
    if(!book)return;
    if(book.borrowed){
        book.borrowed=false;book.by='';book.due='';
        toast(`✅ "${book.title}" returned successfully!`);
    } else {
        const due=new Date();due.setDate(due.getDate()+14);
        book.borrowed=true;
        book.by=`Member #${String(Math.floor(Math.random()*900)+100)}`;
        book.due=due.toISOString().split('T')[0];
        toast(`📤 "${book.title}" borrowed! Due: ${book.due}`);
    }
    save();render();
}

function render(){
    const q=document.getElementById('search').value.toLowerCase();
    let list=books.filter(b=>{
        const match=b.title.toLowerCase().includes(q)||b.author.toLowerCase().includes(q);
        if(filter==='available')return match&&!b.borrowed;
        if(filter==='borrowed')return match&&b.borrowed;
        return match;
    });

    const avail=books.filter(b=>!b.borrowed).length;
    const borrowed=books.filter(b=>b.borrowed).length;
    const genres=new Set(books.map(b=>b.genre)).size;
    document.getElementById('s-total').textContent=books.length;
    document.getElementById('s-avail').textContent=avail;
    document.getElementById('s-borrowed').textContent=borrowed;
    document.getElementById('s-genres').textContent=genres;

    const grid=document.getElementById('books-grid');
    if(list.length===0){
        grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:4rem;color:var(--muted)">No books found.</div>`;
        return;
    }
    grid.innerHTML=list.map(b=>`
        <div class="book-card ${b.borrowed?'borrowed':''}">
            <div class="book-cover">${EMOJIS[b.genre]||'📚'}</div>
            <div class="book-genre">${b.genre}</div>
            <div class="book-title">${b.title}</div>
            <div class="book-author">by ${b.author}</div>
            <div class="book-meta">
                Published: ${b.year}
                ${b.borrowed?`<br>🔖 Borrowed by: <b style="color:var(--text)">${b.by}</b><br>📅 Due: <b style="color:#f59e0b">${b.due}</b>`:''}
            </div>
            <div class="book-footer">
                <span class="status-badge ${b.borrowed?'sb-borrowed':'sb-avail'}">${b.borrowed?'Borrowed':'Available'}</span>
                <button class="borrow-btn ${b.borrowed?'return':''}" onclick="toggleBorrow(${b.id})">
                    ${b.borrowed?'↩ Return':'📤 Borrow'}
                </button>
            </div>
        </div>`).join('');
}

render();
</script>
</body>
</html>
